# Two copies of the same image with different SERVICE_NAMEs, so Log Doctor
# has more than one service to summarise. ${SAMPLE_APP_IMAGE} is filled in
# by scripts/render.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: apps
  labels: &labels
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: log-doctor-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: sample-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${SAMPLE_APP_IMAGE}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: orders-api
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
