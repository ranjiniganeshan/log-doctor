# ${FLUENTD_ROLE_ARN} and ${LOG_DOCTOR_ROLE_ARN} are filled in from Terraform
# outputs by scripts/render.sh. The IRSA roles trust exactly these
# namespace/name pairs; rename them here and you must rename them in
# infra/variables.tf too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
  annotations:
    eks.amazonaws.com/role-arn: ${FLUENTD_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-doctor
  namespace: log-doctor
  annotations:
    eks.amazonaws.com/role-arn: ${LOG_DOCTOR_ROLE_ARN}
---
# The sample app needs no AWS or Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  namespace: apps
automountServiceAccountToken: false
