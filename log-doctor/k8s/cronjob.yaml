# ${LOG_DOCTOR_IMAGE}, ${OPENSEARCH_HOST}, ${AWS_REGION} and ${MODEL_ID} are
# filled in by scripts/render.sh. The Slack webhook comes from the
# "slack-webhook" Secret (make slack-secret). AWS credentials come from IRSA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-doctor-config
  namespace: log-doctor
data:
  OPENSEARCH_HOST: "${OPENSEARCH_HOST}"
  OPENSEARCH_INDEX_PATTERN: "app-logs-*"
  AWS_REGION: "${AWS_REGION}"
  MODEL_ID: "${MODEL_ID}"
  LOOKBACK_MINUTES: "15"
  MAX_SERVICES: "10"
  MAX_MESSAGES_PER_SERVICE: "5"
  SAMPLES_PER_MESSAGE: "2"
  MAX_PROMPT_CHARS: "16000"
  MAX_OUTPUT_TOKENS: "2000"
  LOG_LEVEL: "INFO"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-doctor
  namespace: log-doctor
  labels:
    app.kubernetes.io/name: log-doctor
    app.kubernetes.io/part-of: log-doctor-demo
spec:
  schedule: "*/15 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # never retry: a retry could post the same summary twice
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: log-doctor
        spec:
          serviceAccountName: log-doctor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001 # lets the non-root user read the projected IRSA token
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: log-doctor
              image: ${LOG_DOCTOR_IMAGE}
              envFrom:
                - configMapRef:
                    name: log-doctor-config
              env:
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: slack-webhook
                      key: webhook-url
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
