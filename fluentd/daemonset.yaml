# ${OPENSEARCH_HOST} and ${AWS_REGION} are filled in by scripts/render.sh.
# AWS credentials come from IRSA (annotation on the "fluentd" ServiceAccount).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app.kubernetes.io/name: fluentd
    app.kubernetes.io/part-of: log-doctor-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd
      annotations:
        # Roll the pods whenever the rendered config changes.
        checksum/config: "${FLUENTD_CONFIG_SHA}"
    spec:
      serviceAccountName: fluentd
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.19.4-debian-opensearch-1.2
          env:
            - name: OPENSEARCH_HOST
              value: "${OPENSEARCH_HOST}"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: 100m, memory: 200Mi }
            limits: { memory: 400Mi }
          securityContext:
            # Root is needed to read root-owned files under /var/log/pods.
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/fluentd
      volumes:
        - name: config
          configMap:
            name: fluentd-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/fluentd
            type: DirectoryOrCreate
